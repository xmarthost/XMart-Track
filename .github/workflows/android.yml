name: Android APK

on:
  push:
    branches: [main, xmart-web-ui]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk XMartTrack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: XMartTrack-apk
          path: mobile/XMartTrack.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: XMart Track Android (latest)
          prerelease: false
          make_latest: true
          body: |
            XMart Track Android app, build ${{ github.run_number }} from ${{ github.sha }}.
            Download XMartTrack.apk below and install it on your phone.
          files: mobile/XMartTrack.apk
