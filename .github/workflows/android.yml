name: Android APK

on:
  push:
    branches: [main, xmart-web-ui]
    paths:
      - 'mobile/**'
      - 'VERSION'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: mobile/android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk XMartTrack.apk

      # what the app shows in its "New version released" window (commit titles of this push, no links)
      - name: Write update.json
        env:
          BUILD: ${{ github.run_number }}
        run: |
          jq -r '[.commits[]?.message | split("\n")[0]] | .[]' "$GITHUB_EVENT_PATH" > notes.txt || true
          [ -s notes.txt ] || git log -1 --format=%s > notes.txt
          VERSION_NAME="$(cat ../VERSION)"
          jq -Rn --argjson build "$BUILD" --arg name "$VERSION_NAME" '{versionCode: $build, versionName: $name, notes: [inputs | select(length > 0)]}' notes.txt > update.json
          cat update.json

      - uses: actions/upload-artifact@v4
        with:
          name: XMartTrack-apk
          path: mobile/XMartTrack.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: XMart Track Android (latest)
          prerelease: false
          make_latest: true
          body: |
            XMart Track Android app, build ${{ github.run_number }} from ${{ github.sha }}.
            Download XMartTrack.apk below and install it on your phone.
          files: |
            mobile/XMartTrack.apk
            mobile/update.json

      # every build is also kept as its own version, so an older APK can be installed again
      - name: Keep this build as a version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: XMart Track Android v${{ github.run_number }}
          prerelease: false
          make_latest: false
          body: |
            XMart Track Android app, build ${{ github.run_number }} from ${{ github.sha }}.
            Older version kept for downgrading: install XMartTrack.apk over the current app.
          files: mobile/XMartTrack.apk

      # A new number in VERSION = a new XMart Track release (vX.Y.Z) with this APK, the notes since the
      # last version and the command to install exactly this server version (for rolling back later).
      - name: Version release notes
        id: version
        run: |
          V="$(cat ../VERSION)"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "new=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          PREV="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          {
            echo "## XMart Track $V"
            echo
            echo "### What's new"
            if [ -n "$PREV" ]; then git log "$PREV"..HEAD --no-merges --format='- %s'; else git log -40 --no-merges --format='- %s'; fi
            echo
            echo "### Install this version"
            echo "- Android app: download **XMartTrack.apk** below and install it over the current app."
            echo "- Server (VPS), exactly this version:"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/xmarthost/XMart-Track/xmart-web-ui/install.sh | bash -s -- --version v$V --domain YOUR-DOMAIN"
            echo '```'
            echo "The database, users and settings are kept. Commit: ${{ github.sha }}."
          } > ../version-notes.md
          cat ../version-notes.md
          echo "new=true" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # the web interface of this version, for VPS that cannot build it themselves
      - name: Build web interface for the version release
        if: steps.version.outputs.new == 'true'
        working-directory: traccar-web
        run: |
          npm ci --no-audit --no-fund --loglevel=error && npx vite build
          git rev-parse HEAD:traccar-web > build/TREE
          tar -czf ../mobile/web.tar.gz build

      - name: Publish version release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: XMart Track ${{ steps.version.outputs.version }}
          make_latest: false
          body_path: version-notes.md
          files: |
            mobile/XMartTrack.apk
            mobile/web.tar.gz
